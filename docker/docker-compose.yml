services:
  mongo:
    image: mongo:7
    container_name: zeva-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - zeva-network

  redis:
    image: redis:7-alpine
    container_name: zeva-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - zeva-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: zeva-connect-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ../server/.env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/zeva-connect
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    networks:
      - zeva-network

  nginx:
    image: nginx:alpine
    container_name: zeva-nginx
    restart: unless-stopped
    ports:
      - "8443:443" # <--- HTTPS on 8443
      - "8080:80" # <--- HTTP on 8080 (redirect to HTTPS)

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      - ./ssl:/etc/nginx/ssl:ro

    depends_on:
      - app
    networks:
      - zeva-network

volumes:
  mongo_data:
  nginx_logs:

networks:
  zeva-network:
    driver: bridge
