services:
  mongo:
    image: mongo:7
    container_name: zeva-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - zeva-network
    command: ["mongod", "--bind_ip_all"]

  redis:
    image: redis:7-alpine
    container_name: zeva-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - zeva-network
    command: redis-server --appendonly yes

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: zeva-connect-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ../server/.env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/zeva-connect
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=https://connect.zeva360.com
    depends_on:
      - mongo
      - redis
    networks:
      - zeva-network

  nginx:
    image: nginx:alpine
    container_name: zeva-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - zeva-network

volumes:
  mongo_data:
  nginx_logs:

networks:
  zeva-network:
    driver: bridge
